# Whole stack in containers, using the same images CI ships to Render.
#   docker compose up --build
# Backend http://localhost:8000  Site http://localhost:5173  Recruiter http://localhost:5174

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peeljobs
      POSTGRES_USER: peeljobs
      POSTGRES_PASSWORD: peeljobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peeljobs"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: local-compose-only
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,backend
      SECURE_SSL_REDIRECT: "False"
      DB_NAME: peeljobs
      DB_USER: peeljobs
      DB_PASSWORD: peeljobs
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      SITE_FRONTEND_URL: http://localhost:5173
      RECRUITER_FRONTEND_URL: http://localhost:5174
    depends_on:
      db: { condition: service_healthy }

  site:
    build:
      context: ./site
      dockerfile: ../frontend.Dockerfile
      args:
        # Server-side calls go container-to-container.
        PUBLIC_API_BASE_URL: http://backend:8000/api/v1
    ports: ["5173:3000"]
    environment:
      ORIGIN: http://localhost:5173
    depends_on:
      backend: { condition: service_healthy }

  recruiter:
    build:
      context: ./recruiter
      dockerfile: ../frontend.Dockerfile
      args:
        PUBLIC_API_BASE_URL: http://backend:8000/api/v1
        PUBLIC_SITE_URL: http://localhost:5174
    ports: ["5174:3000"]
    environment:
      ORIGIN: http://localhost:5174
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
