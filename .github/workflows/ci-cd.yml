# CI on every push/PR; on main it also builds images to GHCR and deploys to Render.
#
# Repository settings this needs (Settings → Secrets and variables → Actions):
#   Variables: API_URL, SITE_URL, RECRUITER_URL   e.g. https://peeljobs-api.onrender.com
#   Secrets:   RENDER_HOOK_BACKEND, RENDER_HOOK_SITE, RENDER_HOOK_RECRUITER
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peeljobs
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-only
      DB_NAME: peeljobs
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test --noinput

  frontend:
    name: ${{ matrix.app }} type-check + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [site, recruiter]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # svelte-check types $env/static/public from the environment; .env is
      # gitignored, so use the example's localhost values.
      - run: cp .env.example .env
      - run: pnpm check
      - run: pnpm build

  images:
    name: Push ${{ matrix.name }} image
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
            build_args: |
              APP_VERSION=${{ github.sha }}
          - name: site
            context: site
            file: frontend.Dockerfile
            build_args: |
              PUBLIC_API_BASE_URL=${{ vars.API_URL }}/api/v1
              PUBLIC_SITE_URL=${{ vars.SITE_URL }}
              PUBLIC_RECRUITER_URL=${{ vars.RECRUITER_URL }}
          - name: recruiter
            context: recruiter
            file: frontend.Dockerfile
            build_args: |
              PUBLIC_API_BASE_URL=${{ vars.API_URL }}/api/v1
              PUBLIC_SITE_URL=${{ vars.RECRUITER_URL }}
              PUBLIC_JOBSEEKER_URL=${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/peeljobs-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Render + smoke test
    needs: images
    # Skipped on the bootstrap run, before the Render services exist.
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency: production
    steps:
      - name: Trigger Render deploys with this commit's images
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_HOOK_BACKEND }}
          HOOK_SITE: ${{ secrets.RENDER_HOOK_SITE }}
          HOOK_RECRUITER: ${{ secrets.RENDER_HOOK_RECRUITER }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          deploy() { curl -fsS -X POST -G "$2" --data-urlencode "imgURL=ghcr.io/$owner/peeljobs-$1:${{ github.sha }}"; echo; }
          deploy backend "$HOOK_BACKEND"
          deploy site "$HOOK_SITE"
          deploy recruiter "$HOOK_RECRUITER"

      - name: Wait for the new backend version to be live
        run: |
          # Render pulls the image, runs migrations, then swaps traffic; a free
          # instance may also be cold. Allow up to 15 minutes.
          for i in $(seq 1 90); do
            body=$(curl -s --max-time 60 "${{ vars.API_URL }}/health/" || true)
            echo "[$i] $body"
            if echo "$body" | grep -q '"version": "${{ github.sha }}"' && echo "$body" | grep -q '"status": "ok"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not report version ${{ github.sha }} as healthy"
          exit 1

      - name: Check both frontends respond
        run: |
          for url in "${{ vars.SITE_URL }}" "${{ vars.RECRUITER_URL }}"; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/" || true)
              echo "$url -> $code"
              [ "$code" = "200" ] && continue 2
              sleep 10
            done
            echo "::error::$url did not return 200"; exit 1
          done
